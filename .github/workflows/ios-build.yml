# Build the iOS app on EAS and send it to TestFlight. Run it from the Actions tab
# ("iOS build → TestFlight" → Run workflow). Works after the first build was run once
# interactively (that one stores the Apple signing certificates and App Store Connect key at Expo).
name: iOS build → TestFlight
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
