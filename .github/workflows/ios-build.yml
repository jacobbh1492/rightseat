# Build the iOS app on EAS and send it to TestFlight. Run it from the Actions tab
# ("iOS build → TestFlight" → Run workflow). Choose "submit-latest" to only upload the
# most recent finished build (e.g. when the build was fine but the upload step failed).
name: iOS build → TestFlight
on:
  workflow_dispatch:
    inputs:
      action:
        description: build (build + upload) or submit-latest (upload the newest finished build)
        type: choice
        options: [build, submit-latest]
        default: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - if: inputs.action != 'submit-latest'
        run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
      - if: inputs.action == 'submit-latest'
        run: eas submit --platform ios --profile production --latest --non-interactive --no-wait
