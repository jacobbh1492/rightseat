name: Phone preview (Expo Go)
# Every push to main publishes the app as an over-the-air update on the "preview"
# channel. Open it on your phone in Expo Go (link in README). Needs the EXPO_TOKEN
# repository secret (expo.dev → Account settings → Access tokens).
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas channel:create preview --non-interactive || true
      - run: eas update --channel preview --message "${{ github.event.head_commit.message || 'manual' }}" --non-interactive
